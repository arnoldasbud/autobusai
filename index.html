.st{position:absolute;left:0;top:0;width:18px;height:32px;transition:transform .28s linear}
.st svg{display:block;overflow:visible}
.st .fig{transform-box:view-box;transform-origin:9px 31px;transform:scaleX(var(--f,1))}
.st .l1,.st .l2{transform-box:view-box;transform-origin:9px 21px}
.st .a1,.st .a2{transform-box:view-box;transform-origin:9px 13px}
.st .hd{transform-box:view-box;transform-origin:9px 9px}
.st.i1 .fig{animation:bob 1.9s ease-in-out infinite var(--d)}
.st.i2 .hd{animation:look 3.4s ease-in-out infinite var(--d)}
.st.i3 .a2{animation:wave 5s ease-in-out infinite var(--d)}
.st.i4 .fig{animation:turn 6s steps(1) infinite var(--d)}
.st.i5 .l2{animation:tap 1.3s ease-in-out infinite var(--d)}
.st.i6 .hd{animation:look 2.6s ease-in-out infinite var(--d)}.st.i6 .fig{animation:bob 2.3s ease-in-out infinite var(--d)}
@keyframes bob{0%,100%{transform:scaleX(var(--f,1))}50%{transform:scaleX(var(--f,1)) translateY(-1.3px)}}
@keyframes look{0%,35%,100%{transform:rotate(0)}45%,70%{transform:rotate(16deg)}80%,90%{transform:rotate(-12deg)}}
@keyframes wave{0%,76%,100%{transform:rotate(0)}81%,95%{transform:rotate(-155deg)}86%{transform:rotate(-120deg)}91%{transform:rotate(-160deg)}}
@keyframes turn{0%{transform:scaleX(-1)}55%{transform:scaleX(1)}}
@keyframes tap{0%,55%,100%{transform:rotate(0)}65%,85%{transform:rotate(-20deg)}75%{transform:rotate(-4deg)}}
.st.walk .fig{animation:wb .34s ease-in-out infinite}
.st.old.walk .l1,.st.old.walk .l2,.st.old.walk .a1,.st.old.walk .a2{animation-duration:.8s}
.st.walk .l1,.st.walk .a2{animation:sw .34s ease-in-out infinite alternate}
.st.walk .l2,.st.walk .a1{animation:sw .34s ease-in-out infinite alternate-reverse}
.st.walk .hd{animation:none}
@keyframes sw{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes wb{0%,100%{transform:scaleX(var(--f,1))}50%{transform:scaleX(var(--f,1)) translateY(-1.6px)}}

<script>
/* ===================== ŽAIDIMO VARIKLIS (be grafikos) =====================
   Deterministinis: tas pats lygio numeris -> tas pats išdėstymas.
   Veiksmai: tap(busId), markReady(slot,busId), step(). Multiplayer'iui pakaks siųsti tap'us.
   Aikštelė gali turėti vidinius kelius (rc - stulpeliai, rb - eilutės kiekvienoje juostoje): autobusas išvažiuoja,
   kai kelias iki artimiausio kelio arba krašto laisvas. */
const COLORS=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#ec4899','#14b8a6','#23262e','#8f99a6','#1e293b','#fbbf24'];  // 8 – VIP, 9 – paslėpta spalva, 10 – palyda, 11 – mokyklinis (vaikai)
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ranges(n,cuts){const o=[];let a=0;for(const c of [...cuts,n]){if(c>a)o.push([a,c-1]);a=c+1}return o}
/* kelių tinklas: rc – vertikalūs keliai per visą aukštį; rb[i] – horizontalūs keliai i-tojoje juostoje
   (tarp vertikalių kelių), skirtingose juostose skirtingame aukštyje -> T sankryžos, įvairaus dydžio kvartalai */
function roadNet(W,rc,rb){const band=new Array(W).fill(-1);ranges(W,rc).forEach(([a,b],i)=>{for(let x=a;x<=b;x++)band[x]=i});
  const RC=new Set(rc),RB=rb.map(r=>new Set(r));return (x,y)=>RC.has(x)||(band[x]>=0&&RB[band[x]].has(y))}
/* Pasaulis = 100 lygių (4 skyriai po 25). ll – lygis pasaulyje; naujas pasaulis prasideda nuo nulio.
   Kas 5-as – bosas, kas 25-as – didysis bosas, 100-as – bosų bosas. Sunkumas D kyla laipteliais per skyrius. */
var GENCOOP=false;   // coop lygių generavimas (be VIP, specialių vietų ir kt.)
function params(L){
  const ll=(L-1)%100+1,ch=Math.floor((ll-1)/25),cl=(ll-1)%25,pr=rng(L*977+5);
  const mega=ll===100,big=ll%25===0,boss=ll%5===0,easy=!boss&&ll>5&&ll%5===1;
  const D=Math.min(1,ch*.2+cl/25*.3+(mega?.3:big?.15:boss?.08:0));
  // didesni kvartalai (mažiau vidinių kelių) -> autobusai labiau trukdo vieni kitiems
  let W,H,nrc=0;
  if(ll<=2){W=5;H=6}
  else if(ll<6){W=6;H=8}
  else if(ll<15){W=7;H=8+Math.floor(ll/6)}
  else if(ll<30){W=9;H=8+Math.floor(ll/6)}
  else if(ll<55){W=11;nrc=1;H=Math.min(24,8+Math.floor(ll/6))}
  else{W=14;nrc=2;H=Math.min(24,8+Math.floor(ll/6))}
  const rc=[];
  if(nrc===1)rc.push(4+Math.floor(pr()*3));
  if(nrc===2){const a=4+Math.floor(pr()*2);rc.push(a,a+5+Math.floor(pr()*Math.min(2,W-a-9)))}
  const rb=ranges(W,rc).map(()=>{const rows=[];if(H>=13){let y=5+Math.floor(pr()*3);while(y<=H-5){rows.push(y);y+=6+Math.floor(pr()*4)}}return rows});
  const P=ranges(W,rc).reduce((t,[a,b],i)=>t+(b-a+1)*(H-rb[i].length),0),roads=rc.length+rb.flat().length>0;
  const dv=roads?2.05:2.3;
  let n=ll<=2?4+ll:Math.min(Math.floor(P/dv),Math.round(8+ll*.9+D*12),80);
  if(boss)n=Math.min(Math.floor(P/(dv-.25)),Math.round(n*(mega?1.3:big?1.2:1.12)),90);
  if(easy)n=Math.round(n*.8);
  const colors=GENCOOP?Math.max(4,Math.min(7,3+Math.round(D*4))):ll<=2?2:Math.min(7,3+Math.round(D*4)+(boss?1:0));
  const vipN=GENCOOP?0:boss?((big||mega)?2:1):0;
  // bosai: eilė sumaišyta taip, kad reikia visų vietų – įveikiama tik tinkama tvarka, klaidos beveik neatleidžiamos
  const win=Math.min(GENCOOP?4:5,ll<=2?2:boss&&ll>=10?5-vipN:Math.min(5-vipN,4,2+Math.round(D*2.5)+(boss?1:0)));
  // mechanikos: 1 skyrius – jokių, 2 – pirmoji pasaulio, 3 – antroji, 4 – visos; vėlesni pasaulių ratai – mišinys
  const wi=Math.floor((L-1)/100),wk=wi%4,f=.5+cl/25*.5,CHM=[[['obst','oneway'],['lights','truck','tram'],['obst','lights','truck','locked','tram','oneway']],
       [['roadblk','leaves'],['hidden','animals','mud'],['roadblk','hidden','animals','mud','leaves']],
       [['obst','heat'],['hidden','caravan'],['obst','hidden','storm','heat','caravan']],
       [['locked','freeze'],['ice','plow'],['locked','ice','obst','freeze','plow']]][wk],on=new Set(ch>0?CHM[ch-1]:[]);
  if(wi>=4&&ch>0)['obst','hidden','locked','lights','truck','storm','ice','animals','mud','leaves','tram','oneway','caravan','heat','plow','freeze'].forEach(m=>{if(pr()<.3)on.add(m)});
  if(GENCOOP)['plow','freeze','storm'].forEach(m=>on.delete(m));
  const vip=GENCOOP?null:boss?(mega?'all':['pax','bus','esc'][Math.floor(ll/5)%3]):null;
  const specials=[];if(ll>6&&pr()<Math.min(.6,.2+D*.6)){const k=Math.min(2,5-win-vipN);for(let i=0;i<k;i++)if(pr()<.75)specials.push(['repair','color','short','temp'][Math.floor(pr()*4)])}
  const mech={on:[...on],obst:(on.has('obst')||on.has('roadblk'))?Math.round((1+P/60)*f)+1:0,lights:on.has('lights')?2+Math.round(f*2):0,
    hidden:on.has('hidden')?.18+.2*f:0,locked:on.has('locked')?.08+.1*f:0,vip,vipN,first:cl===0&&ch>0,specials,truck:on.has('truck')?1+Math.round(f*1.5):0,storm:on.has('storm'),ice:on.has('ice')?.12+.12*f:0,stroller:ll>8&&pr()<.35?1+Math.round(D*2):0,animals:on.has('animals')?2+Math.round(f):0,tram:on.has('tram'),caravan:on.has('caravan'),oneway:on.has('oneway')?2:0,heat:on.has('heat'),plow:on.has('plow'),freeze:on.has('freeze'),mud:on.has('mud')?.06+.08*f:0,leaves:on.has('leaves')?.2+.2*f:0,
    veh:ll>6?Math.min(.25,.06+D*.25):0,chal:ll>2,mod:ll>4&&pr()<.35?['twoq','senior','friends'][Math.floor(pr()*3)]:null};
  if(GENCOOP){mech.specials=[];mech.chal=false;mech.mod=null;mech.stroller=0}
  return {ll,W,H,rc,rb,n,colors,win,slots:GENCOOP?4:5,long:0.45,boss,easy,big,mega,roads,mech};
}
const VERSION='1.5.2';   // ⚠️ keičiant žaidimą – padidinti čia ir version.json
const VIPC=8,HIDC=9,ESCC=10,KIDC=11;
/* kelio atkarpa tarp sankryžų, į kurią veda langelis (x,y) – kliūtys ir šviesoforai uždaro visą atkarpą */
function segOf(W,H,rc,rb,x,y){
  const bands=ranges(W,rc),isV=x===-1||x===W||rc.includes(x);
  if(isV&&y>=0&&y<H){const rows=new Set();
    if(x===-1)(rb[0]||[]).forEach(r=>rows.add(r));else if(x===W)(rb[bands.length-1]||[]).forEach(r=>rows.add(r));
    else{const i=rc.indexOf(x);(rb[i]||[]).forEach(r=>rows.add(r));(rb[i+1]||[]).forEach(r=>rows.add(r))}
    if(rows.has(y))return null;let a=y,b=y;while(a-1>=0&&!rows.has(a-1))a--;while(b+1<H&&!rows.has(b+1))b++;
    const cells=[];for(let k=a;k<=b;k++)cells.push([x,k]);return {key:'v'+x+'_'+a,line:'v'+x,cells,vert:true}}
  if(y===H){if(x<0||x>=W||rc.includes(x))return null;let a=x,b=x;while(a-1>=0&&!rc.includes(a-1))a--;while(b+1<W&&!rc.includes(b+1))b++;
    const cells=[];for(let k=a;k<=b;k++)cells.push([k,H]);return {key:'b'+a,line:'b'+a,cells,vert:false}}
  const bi=bands.findIndex(([a,b])=>x>=a&&x<=b);if(bi<0)return null;const [a,b]=bands[bi],cells=[];for(let k=a;k<=b;k++)cells.push([k,y]);
  return {key:'h'+y+'_'+bi,line:'h'+y+'_'+bi,cells,vert:false};
}
function generate(L){
  const p=params(L),road=roadNet(p.W,p.rc,p.rb),M=p.mech,W=p.W,H=p.H;
  const rayBlk=(b,occ)=>{const [dx,dy]=DIRS[b.dir];for(let x=b.fx+dx,y=b.fy+dy;x>=0&&y>=0&&x<W&&y<H&&!road(x,y);x+=dx,y+=dy)if(occ[y*W+x]!==-1)return true;return false};
  let best=null;
  for(let attempt=0;attempt<10;attempt++){
    const r=rng(L*7919+attempt*104729+13),occ=new Array(W*H).fill(-1),buses=[];
    const place=(len,tries,strict)=>{
      for(let t=0;t<tries;t++){
        const dir=Math.floor(r()*4),fx=Math.floor(r()*W),fy=Math.floor(r()*H),[dx,dy]=DIRS[dir],cells=[];let ok=true;
        for(let i=0;i<len;i++){const x=fx-dx*i,y=fy-dy*i;if(x<0||y<0||x>=W||y>=H||road(x,y)||occ[y*W+x]!==-1){ok=false;break}cells.push([x,y])}
        if(!ok)continue;
        let pl=0;for(let x=fx+dx,y=fy+dy;x>=0&&y>=0&&x<W&&y<H&&!road(x,y);x+=dx,y+=dy,pl++)if(occ[y*W+x]!==-1){ok=false;break}
        if(!ok)continue;
        if(strict&&p.ll>3&&pl<2&&r()<.7)continue;   // daugiau autobusų, kuriems reikia pravažiuoti pro kitus
        const id=buses.length;cells.forEach(([x,y])=>occ[y*W+x]=id);
        buses.push({id,fx,fy,dir,len,cells,cap:len===3?6:4,color:0,lock:0,hidden:false,kind:'n'});return true}
      return false};
    const popLast=()=>{const q=buses.pop();if(q)q.cells.forEach(([x,y])=>occ[y*W+x]=-1);return q};
    for(let tries=0;tries<14000&&buses.length<p.n;tries+=40){const tx=M.veh&&r()<M.veh*.35;if(place(tx?1:r()<p.long?3:2,40,true)&&tx){const t=buses[buses.length-1];t.kind='taxi';t.cap=2}}
    let vip=-1,esc=[];
    const vips=[];
    if(M.vip){if(M.vipN>1)for(let k=0;k<4;k++)popLast();for(let v=0;v<M.vipN;v++){let got=-1;for(let k=0;k<15;k++){if(place(2,3000,false)){got=buses.length-1;break}if(v>0||!popLast())break}if(got>=0)vips.push(got)}if(!vips.length)continue;vip=vips[0];
      if(M.vip==='esc'||M.vip==='all')for(let e=0;e<2;e++){if(!place(1,4000,false))break;const b=buses[buses.length-1];b.kind='esc';b.cap=0;b.color=ESCC;esc.push(b.id)}}
    const blocked=buses.filter(b=>rayBlk(b,occ)).length,sc=Math.min(buses.length,p.n+(M.vip?3:0))*10+blocked*4;
    if(!best||sc>best.sc)best={sc,buses,r,vip,esc,vips};
  }
  if(!best)throw new Error('generate failed '+L);
  const {buses,r,vip,esc}=best,vips=best.vips||[],cols=shuffle([...Array(8).keys()],r).slice(0,p.colors);
  const norm=buses.filter(b=>b.kind==='n'&&!vips.includes(b.id)),order=shuffle(norm.map(b=>b.id),r);
  order.forEach((id,i)=>buses[id].color=i<cols.length?cols[i]:cols[Math.floor(r()*cols.length)]);
  norm.forEach(b=>{if(b.len===3&&r()<M.veh){if(r()<.5){b.kind='dd';b.cap=8}else{b.kind='school';b.cap=9;b.color=KIDC}}else if(b.len===2&&r()<M.veh*.8){b.kind='car';b.cap=3;b.len=1;b.cells=b.cells.slice(0,1)}});   // lengvoji mašina: 1 langelis, 3 vietos
  const sol=buses.map(b=>b.id).reverse(),queue=[];   // eskortas ir VIP – pirmieji sprendime
  sol.forEach((id,k)=>{const b=buses[id];if(b.kind==='esc'||vips.includes(id))return;
    if(M.locked&&k>=2&&r()<M.locked)b.lock=Math.min(k,2+Math.floor(r()*4));
    if(M.hidden&&r()<M.hidden)b.hidden=true;else if(M.leaves&&b.len>1&&r()<M.leaves)b.leafy=true});
  const ns=sol.filter(id=>!vips.includes(id)&&buses[id].kind!=='esc');
  for(let i=0;i<ns.length;i+=p.win){
    const chunk=[];ns.slice(i,i+p.win).forEach(id=>{for(let k=0;k<buses[id].cap;k++)chunk.push(buses[id].color)});
    queue.push(...shuffle(chunk,r));
  }
  if(M.vip&&(M.vip==='esc')&&!esc.length)M.vip='pax';
  vips.forEach(v=>{const b=buses[v];b.color=VIPC;b.cap=4;b.esc=esc.length});
  if(vips.length){const Q=queue.length,fr=vips.length>1?[.06,.16,.28,.4,.52,.64,.78,.93]:[.1,.37,.64,.93];fr.map(f=>Math.round(Q*f)).reverse().forEach(pos=>queue.splice(pos,0,VIPC))}
  // vežimėliai: du iš eilės tos pačios spalvos keleiviai, kurie sprendime lipa į tą patį autobusą, tampa vienu (užima 2 vietas)
  const wt=[];const simSlots=()=>{const so=[],sl=[];let q=0;const dr=()=>{for(;q<queue.length;){const w=wt[q]||1,s3=sl.find(o=>o.c===queue[q]&&o.cap-o.f>=w);if(!s3)break;s3.f+=w;so[q]=sl.indexOf(s3);q++}};
    sol.forEach(id=>{dr();if(buses[id].cap)sl.push({c:buses[id].color,cap:buses[id].cap,f:0})});dr();return so};
  if(M.stroller){let so=simSlots(),n=0;for(let i=queue.length-3;i>2&&n<M.stroller;i-=Math.max(3,Math.floor(queue.length/(M.stroller+1)))){
    for(let j=i;j>Math.max(0,i-12);j--){if(queue[j]!==VIPC&&queue[j]===queue[j+1]&&so[j]===so[j+1]&&!wt[j]&&!wt[j+1]){queue.splice(j+1,1);wt.splice(j+1,1);wt[j]=2;n++;so=simSlots();break}}}}
  // sprendimo simuliacija: kiek keleivių būna įlipę, kai išvažiuoja kiekvienas autobusas
  const qiAt=[],sl=[];let qi=0;const drain=()=>{for(;qi<queue.length;){const w=wt[qi]||1,s=sl.find(o=>o.c===queue[qi]&&o.cap-o.f>=w);if(!s)break;s.f+=w;qi++}};
  const tapAt=[];sol.forEach((id,k)=>{drain();qiAt[id]=qi;tapAt[id]=k;if(buses[id].cap)sl.push({c:buses[id].color,cap:buses[id].cap,f:0})});
  const segs=new Map();
  buses.forEach(b=>{const [dx,dy]=DIRS[b.dir];let x=b.fx+dx,y=b.fy+dy;while(x>=0&&y>=0&&x<W&&y<H&&!road(x,y)){x+=dx;y+=dy}
    if(y<0)return;const sg=segOf(W,H,p.rc,p.rb,x,y);if(!sg)return;const e=segs.get(sg.key)||{...sg,min:1e9,mk:1e9,n:0};e.min=Math.min(e.min,qiAt[b.id]);e.mk=Math.min(e.mk,tapAt[b.id]);e.n++;segs.set(sg.key,e)});
  const robs=[],lights=[],usedL=new Set();
  if(M.obst){const cand=[...segs.values()].filter(e=>e.min>=4).sort((a,b)=>b.min*(1+b.n*.4)-a.min*(1+a.n*.4));
    for(const e of cand){if(robs.length>=M.obst)break;if(usedL.has(e.line)||r()<.2)continue;usedL.add(e.line);
      robs.push({cells:e.cells,vert:e.vert,t:Math.max(3,Math.floor(e.min*(.55+.45*r()))),on:true})}}
  if(M.truck){const cand=shuffle([...segs.values()].filter(e=>!usedL.has(e.line)&&e.mk>=3),r);
    for(const e of cand){if(robs.filter(o=>o.kind==='truck').length>=M.truck)break;usedL.add(e.line);robs.push({kind:'truck',cells:e.cells,vert:e.vert,t:Math.max(2,Math.floor(e.mk*(.5+.3*r()))),on:true})}}
  // judančios kliūtys: tramvajus (tiesia linija) ir kupranugarių karavanas (ratu)
  const movers=[];const lineCells=k=>{const o=[];if(k==='L')for(let y=0;y<H;y++)o.push([-1,y]);else if(k==='B')for(let x=-1;x<=W;x++)o.push([x,H]);else if(k==='R')for(let y=H-1;y>=0;y--)o.push([W,y]);else for(let y=0;y<H;y++)o.push([k,y]);return o};
  if(M.tram){const k=p.rc.length?p.rc[Math.floor(r()*p.rc.length)]:'B';movers.push({kind:'tram',cells:lineCells(k),len:3,period:9000+Math.floor(r()*3000),off:Math.floor(r()*9000),ping:false})}

  if(st.includes('repair'))o.push(['sp_repair','🚧','Remontuojama vieta','Bus atidaryta, kai iš stotelės išvažiuos nurodytas skaičius autobusų 🔧.']);
  if(g.movers.some(m=>m.kind==='tram'))o.push(['tram','🚋','Tramvajus','Bėgiais retkarčiais pravažiuoja tramvajus. Autobusas, išvažiuojantis tuo metu į jo kelią, atsitrenkia.']);
  if(g.movers.some(m=>m.kind==='caravan'))o.push(['caravan','🐪','Kupranugarių karavanas','Lėtai eina išoriniu keliu pirmyn ir atgal. Kur jis yra, ten išvažiuoti negalima.']);
  if(g.oneway.length)o.push(['oneway','➜','Vienos krypties gatvės','Išvažiavęs autobusas suka į dešinę. Jei mėlyna rodyklė rodo priešingai – atsitrenks. Kryptis keičiasi kas 12 s (⇄ rodo, po kiek).']);

  if(g.vips.length>1)o.push(['vip2','👑','Du VIP autobusai','Šiame lygyje du VIP autobusai ir 8 VIP keleiviai – abu užima vietą stotelėje.']);
  if(g.buses.some(b=>b.kind==='taxi'))o.push(['taxi','🚕','Taksi','Užima vieną langelį, telpa tik 2 keleiviai.']);
  if(g.buses.some(b=>b.kind==='school'))o.push(['school','🚸','Mokyklinis autobusas','Geltonas, ilgu priekiu ir su STOP ženklu. Veža tik vaikus (su geltonomis kepuraitėmis) – telpa 9. Vaikai į kitus autobusus nelipa.']);
  if(g.wt.some(Boolean))o.push(['pram','👶','Keleivis su vežimėliu','Užima 2 vietas – autobuse turi būti bent 2 laisvos vietos.']);
  if(st.includes('temp'))o.push(['sp_temp','⏱','Laikina vieta','Autobusas gali stovėti tik 14 s. Jei nespėja prisipildyti – grįžta į aikštelę su jau įlipusiais keleiviais.']);
  if(g.buses.some(b=>b.kind==='dd'))o.push(['veh_dd','🚌','Dviaukštis autobusas','Pažymėtas „2“ ant stogo – telpa 8 keleiviai.']);
  if(g.buses.some(b=>b.kind==='car'))o.push(['veh_car','🚗','Lengvoji mašina','Užima vieną langelį, telpa 3 keleiviai (be taksi ženklo).']);
  if(g.mod==='twoq')o.push(['mod_twoq','👥','Dvi eilės','Keleiviai stovi dviem eilėmis. Lipti gali pirmas iš bet kurios eilės – nereikia laukti, kol atvažiuos autobusas kitam.']);
  if(g.mod==='senior')o.push(['mod_senior','🧓','Lėtas senjoras','Senjoras su lazdele eina lėtai – kol jis lipa, visa eilė laukia.']);
  if(g.mod==='friends')o.push(['mod_friends','🤝','Draugų grupė','Trys draugai (pažymėti 🤝) lipa tik į tą patį autobusą – jame turi būti bent 3 laisvos vietos.']);
  if(g.chal)o.push(['chal','🎯','Iššūkis: '+chalText(g.chal),'Įvykdęs gausi ★. Iš viso 4 ★: už įveiktą lygį, už laiką, už ėjimų skaičių (atsitrenkimai – irgi ėjimai) ir už šią užduotį.']);
  return o}
function showHints(){const it=hintItems();showCard(`<h2>💡 Šiame lygyje</h2><div class="hl">${it.map(h=>`<div><b>${h[1]}</b><p><strong>${h[2]}</strong>${h[3]}</p></div>`).join('')}</div><button class="primary" id="hok">Supratau</button>`);
  $('hok').onclick=()=>$('overlay').classList.remove('show');$('hint').classList.remove('new');
  const seen=store.get('busjam.seenHints',{});it.forEach(h=>seen[h[0]]=1);store.set('busjam.seenHints',seen)}
function toast(t,s){const el=$('toast');el.innerHTML=t+(s?`<small>${s}</small>`:'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
function layout(){
  const w=worldOf(level),vw=$('view').clientWidth;
  cell=Math.max(44,Math.min(58,Math.floor(vw/(game.W+3.4))));M=Math.round(cell*.7);U=Math.round(cell*.86);
  document.documentElement.style.setProperty('--curb',w.curb);
  document.body.style.backgroundImage=css(w.out);document.body.style.backgroundSize=cell*4.2+'px';
  $('platform').style.background=css(w.plat);$('platform').style.backgroundSize=cell*2+'px';
  $('bays').style.backgroundImage=css(w.road);$('bays').style.backgroundSize=cell*4+'px';
  $('bays').style.height=U*3+30+'px';
  const ez=$('esczone');ez.innerHTML='';ez.style.display=game.esc&&game.esc.length?'block':'none';ez.style.height=Math.round(U*1.25)+'px';ez.style.backgroundImage=css(w.road);ez.style.backgroundSize=cell*4+'px';
}
/* pasaulio koordinatės: viršuje pagrindinis kelias (y=-1), aikštelė y=0..H-1, apačioje žiedas (y=H);
   x=-1 ir x=W – šoniniai žiedo keliai. Visas kelių tinklas piešiamas kaip vienas paviršius su užapvalintomis sankryžomis. */
const wx=x=>M+(x+1.5)*cell,wy=y=>(y+1.5)*cell;
function div(cls,st){const d=document.createElement('div');d.className=cls;Object.assign(d.style,st);return d}
function buildWorld(){
  const w=worldOf(level),{W,H,rc,rb}=game,bands=ranges(W,rc),wd=$('world'),vw=$('view').clientWidth,px=v=>v+'px',C=cell;
  const ringW=(W+2)*C;M=Math.max(Math.round(C*1.4),Math.ceil((vw/0.75-ringW)/2));
  WW=ringW+2*M;WH=Math.max((H+2)*C+Math.round(C*1.6),Math.ceil($('view').clientHeight/0.75));
  const ox=M+C,oy=C,xL=M,xR=M+ringW,yB=(H+2)*C,rf=C*.6,Rr=C*1.15,f=v=>v.toFixed(1);
  wd.innerHTML='';Object.assign(wd.style,{width:px(WW),height:px(WH)});
  const pat=(id,u,sz)=>`<pattern id="${id}" patternUnits="userSpaceOnUse" width="${sz}" height="${sz}"><image href="${u}" width="${sz}" height="${sz}"/></pattern>`;
  // kelių paviršius
  const road=`M0 0H${WW}V${C}H${xR+rf}Q${xR} ${C} ${xR} ${C+rf}V${yB-Rr}Q${xR} ${yB} ${xR-Rr} ${yB}H${xL+Rr}Q${xL} ${yB} ${xL} ${yB-Rr}V${C+rf}Q${xL} ${C} ${xL-rf} ${C}H0Z`;
  const curb=`M${WW} ${C}H${xR+rf}Q${xR} ${C} ${xR} ${C+rf}V${yB-Rr}Q${xR} ${yB} ${xR-Rr} ${yB}H${xL+Rr}Q${xL} ${yB} ${xL} ${yB-Rr}V${C+rf}Q${xL} ${C} ${xL-rf} ${C}H0`;
  let g='';
  for(const [bi,[x0,x1]] of bands.entries())for(const [y0,y1] of ranges(H,rb[bi]))
    g+=`<rect x="${ox+x0*C}" y="${oy+y0*C}" width="${(x1-x0+1)*C}" height="${(y1-y0+1)*C}" rx="${C*.35}" fill="url(#pL)" stroke="${w.curb}" stroke-width="5"/>`
     +`<rect x="${ox+x0*C+5}" y="${oy+y0*C+5}" width="${(x1-x0+1)*C-10}" height="${(y1-y0+1)*C-10}" rx="${C*.28}" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="6"/>`;
  // žymėjimas
  const gp=C*.2,X0=wx(-1),X1=wx(W),Y1=wy(H),r=Rr-C/2,top=C+C*.5;
  let d=`M0 ${C/2}H${WW}M${X0} ${top}V${Y1-r}Q${X0} ${Y1} ${X0+r} ${Y1}H${X1-r}Q${X1} ${Y1} ${X1} ${Y1-r}V${top}`;
  for(const c of rc)d+=`M${wx(c)} ${top}V${oy+H*C-C*.45}`;
  bands.forEach(([a,b],bi)=>{for(const rw of rb[bi])d+=`M${ox+a*C+C*.45} ${wy(rw)}H${ox+(b+1)*C-C*.45}`});
  let z='';const zb=(x,y,a,b)=>{z+=`<rect x="${f(x)}" y="${f(y)}" width="${f(a)}" height="${f(b)}" rx="1" fill="rgba(255,255,255,.6)"/>`};
  for(const c of [-1,W,...rc]){const x=c<0?xL:c===W?xR-C:ox+c*C;for(let k=0;k<5;k++)zb(x+C*(.08+k*.19),C+C*.06,C*.1,C*.3);
    g+=`<rect x="${x+2}" y="${C+C*.42}" width="${C-4}" height="3" fill="rgba(255,255,255,.55)"/>`}
  for(const c of rc)for(let k=0;k<5;k++)zb(ox+c*C+C*(.08+k*.19),oy+H*C-C*.36,C*.1,C*.3);
  bands.forEach(([a,b],bi)=>{for(const rw of rb[bi])for(const xe of [ox+a*C+C*.04,ox+(b+1)*C-C*.34])for(let k=0;k<5;k++)zb(xe,oy+rw*C+C*(.08+k*.19),C*.3,C*.1)});
  // dekoracijos tik ten, kur nėra kelio
  const rg=rng(level*31+7),R0=C*.62;let dec='';const pts=[];
  const zones=[[R0+4,xL-R0-8,C+R0+6,WH-R0-4],[xR+R0+8,WW-R0-4,C+R0+6,WH-R0-4],[R0+4,WW-R0-4,yB+R0+8,WH-R0-4]];
  for(const [a,b,c2,e] of zones){if(b<=a||e<=c2)continue;const area=(b-a+2*R0)*(e-c2+2*R0),cnt=Math.round(area/(C*C*4.5));
    for(let i=0,tries=0;i<cnt&&tries<cnt*8;tries++){const x=a+rg()*(b-a),y=c2+rg()*(e-c2),R=R0*(.7+rg()*.5);
      if(pts.some(q=>Math.hypot(q[0]-x,q[1]-y)<(q[2]+R)*.95))continue;pts.push([x,y,R]);i++;
      dec+=w.decor[Math.floor(rg()*w.decor.length)](x,y,Math.min(R,(b>a?R0*1.2:R)))}}
  wd.innerHTML=`<svg class="ground" width="${WW}" height="${WH}" viewBox="0 0 ${WW} ${WH}"><defs>${pat('pO',w.out,C*4.2)}${pat('pR',w.road,C*4)}${pat('pL',w.lot,C*4)}</defs>
   <rect width="${WW}" height="${WH}" fill="url(#pO)"/>${dec}<path d="${road}" fill="url(#pR)"/><path d="${curb}" fill="none" stroke="${w.curb}" stroke-width="5"/>
   ${g}<path d="${d}" stroke="rgba(255,255,255,.5)" stroke-width="2.5" fill="none" stroke-dasharray="${C*.3} ${C*.22}"/>${z}
   ${game.obst.map(k=>{const x=k%W,y=Math.floor(k/W),rd=game.blk.includes(k);return obstSVG(w.name,ox+(x+.5)*C,oy+(y+.5)*C,C,rd,rc.includes(x))}).join('')}</svg>`;
  game.inLot.forEach(id=>{
    const b=game.buses[id],xs=b.cells.map(c=>c[0]),ys=b.cells.map(c=>c[1]),mx=Math.min(...xs),my=Math.min(...ys);
    const el=div('bus',{left:px(ox+mx*C),top:px(oy+my*C),width:px((Math.max(...xs)-mx+1)*C),height:px((Math.max(...ys)-my+1)*C)});
    el.dataset.id=id;el.innerHTML=lotBusSVG(b)+lockHTML(b)+leafHTML(b);wd.appendChild(el);
  });
  const segBox=o=>{const xs=o.cells.map(c=>wx(c[0])),ys=o.cells.map(c=>wy(c[1]));return {x0:Math.min(...xs)-C/2,y0:Math.min(...ys)-C/2,x1:Math.max(...xs)+C/2,y1:Math.max(...ys)+C/2}};
  game.robs.forEach((o,i)=>{if(!o.on)return;const bx=segBox(o),mc=o.cells[Math.floor(o.cells.length/2)];
    const e=div('obs',{left:px(bx.x0),top:px(bx.y0),width:px(bx.x1-bx.x0),height:px(bx.y1-bx.y0)});e.dataset.o=i;
    const cx=wx(mc[0])-bx.x0,cy=wy(mc[1])-bx.y0;
    e.innerHTML=`<div class="tape ${o.vert?'v':'h'}"></div><svg width="${bx.x1-bx.x0}" height="${bx.y1-bx.y0}" overflow="visible" style="position:absolute;left:0;top:0">${o.kind==='truck'?truckSVG(cx,cy,C,o.vert):obstSVG(w.name,cx,cy,C,true,o.vert)}</svg><span class="cnt" style="left:${cx}px;top:${cy-C*.62}px">${obsLabel(o)}</span>`;wd.appendChild(e)});
  // ledas ir smėlio audra
  if(game.mud.length){const md=document.createElementNS('http://www.w3.org/2000/svg','svg');md.setAttribute('class','ground');md.setAttribute('width',WW);md.setAttribute('height',WH);
    md.innerHTML=game.mud.map(k=>{const x=ox+(k%W)*C+C/2,y=oy+Math.floor(k/W)*C+C/2,r=hr(k*7+level);return `<ellipse cx="${x}" cy="${y}" rx="${C*(.36+r*.1)}" ry="${C*(.28+r*.08)}" fill="#5b4126" opacity=".85"/><ellipse cx="${x-C*.08}" cy="${y-C*.06}" rx="${C*.18}" ry="${C*.1}" fill="#7a5a3a" opacity=".8"/><circle cx="${x+C*.2}" cy="${y+C*.12}" r="${C*.05}" fill="#a07a50"/>`}).join('');
    wd.insertBefore(md,wd.children[1])}
  game.movers.forEach((m,i)=>{if(m.kind==='tram'){const rl=document.createElementNS('http://www.w3.org/2000/svg','svg');rl.setAttribute('class','ground');rl.setAttribute('width',WW);rl.setAttribute('height',WH);
      const a=m.cells[0],z=m.cells[m.cells.length-1],v=a[0]===z[0];let d='';for(const o of [-.18,.18]){d+=v?`M${wx(a[0])+o*C} ${wy(a[1])-C/2}V${wy(z[1])+C/2}`:`M${wx(a[0])-C/2} ${wy(a[1])+o*C}H${wx(z[0])+C/2}`}
      rl.innerHTML=`<path d="${d}" stroke="#9ca3af" stroke-width="3"/><path d="${d}" stroke="#e5e7eb" stroke-width="1"/>`;wd.insertBefore(rl,wd.children[2]||null)}
    for(let k=0;k<m.len;k++){const e=div('mov '+m.kind,{width:px(C*.9),height:px(C*.9),display:'none'});e.dataset.m=i;e.dataset.k=k;e.innerHTML=m.kind==='tram'?'<i></i>':'🐪';wd.appendChild(e)}});
  game.oneway.forEach((o,i)=>{const bx=segBox(o),e=div('ow',{left:px(bx.x0),top:px(bx.y0),width:px(bx.x1-bx.x0),height:px(bx.y1-bx.y0)});e.dataset.w=i;e.innerHTML='<b>➜</b><span>⇄</span>';wd.appendChild(e)});
  game.animals.forEach((l,i)=>{const bx=segBox(l),e=div('ani',{left:px(bx.x0),top:px(bx.y0),width:px(bx.x1-bx.x0),height:px(bx.y1-bx.y0)});e.dataset.a=i;e.classList.add(l.vert?'v':'h');
    e.innerHTML=`<div class="sign">🦌</div><div class="deer">🦌</div>`;wd.appendChild(e)});
  if(game.ice.length){const ic=document.createElementNS('http://www.w3.org/2000/svg','svg');ic.setAttribute('class','ground');ic.setAttribute('width',WW);ic.setAttribute('height',WH);
    ic.innerHTML=game.ice.map(k=>{const x=ox+(k%W)*C,y=oy+Math.floor(k/W)*C;return `<rect x="${x+2}" y="${y+2}" width="${C-4}" height="${C-4}" rx="${C*.3}" fill="rgba(190,230,255,.55)" stroke="rgba(255,255,255,.8)" stroke-width="1.5"/><path d="M${x+C*.25} ${y+C*.3}l${C*.18} ${C*.1}M${x+C*.55} ${y+C*.6}l${C*.2} -${C*.08}" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>`}).join('');
    wd.insertBefore(ic,wd.children[1])}
  if(game.storm){const st=div('storm',{left:px(ox),top:px(oy),width:px(W*C/2+C*.5),height:px(H*C)});st.id='storm';wd.appendChild(st)}
  game.lights.forEach((l,i)=>{const bx=segBox(l),e=div('lgt',{left:px(bx.x0),top:px(bx.y0),width:px(bx.x1-bx.x0),height:px(bx.y1-bx.y0)});e.dataset.l=i;
    e.innerHTML=`<div class="lamp" style="${l.vert?'left:50%;top:-14px':'left:-14px;top:50%'}"><i></i><i></i></div>`;wd.appendChild(e)});
}
/* kliūtys: aikštelėje ir ant kelių */
function obsLabel(o){return o.kind==='truck'?'🚚 '+Math.max(0,o.t-game.moves)+' ėj.':'👥 '+(o.t-(game.S?game.qAll():game.qi))}

function route(sx,sy,bayX,ty=-1){

/* ===================== QR KODAS (baitų režimas, M lygis) ===================== */
const QR=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
             M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const BLK={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
             M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const EB={L:1,M:0};
  const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawMods(v)/8)-ECC[e][v]*BLK[e][v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
  function encode(text,e='M'){
    const bytes=[...new TextEncoder().encode(text)];let v=1;
    for(;v<=40;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=dataCw(v,e)*8)break}
    if(v>40)throw new Error('QR per ilgas');
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCw(v,e)*8;put(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
    for(let p=0xEC;data.length<cap/8;p^=0xEC^0x11)data.push(p);
    // blokai + RS
    const nb=BLK[e][v],el=ECC[e][v],raw=Math.floor(rawMods(v)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const ec=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(ec))}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)cw.push(b[i])});
    // matrica
    const N=v*4+17,M=[...Array(N)].map(()=>new Array(N).fill(false)),F=[...Array(N)].map(()=>new Array(N).fill(false));
    const set=(x,y,c)=>{M[y][x]=c;F[y][x]=true};
    for(let i=0;i<N;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&y>=0&&x<N&&y<N)set(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(N-4,3);finder(3,N-4);
    if(v>1){const na=Math.floor(v/7)+2,st=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2,ps=[6];for(let p=N-7;ps.length<na;p-=st)ps.splice(1,0,p);
      ps.forEach((x,i)=>ps.forEach((y,j)=>{if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
    const fmt=mask=>{const d=EB[e]<<3|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412,g=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(N-1-i,8,g(i));for(let i=8;i<15;i++)set(8,N-15+i,g(i));set(8,N-8,true)};
    fmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const c=((b>>>i)&1)===1,a=N-11+i%3,bb=Math.floor(i/3);set(a,bb,c);set(bb,a,c)}}
    let i=0;for(let right=N-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<N;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?N-1-vert:vert;
      if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++}}}
    const MF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!F[y][x]&&MF[m](x,y))M[y][x]=!M[y][x]};
    const pen=()=>{let p=0,dk=0;for(let a=0;a<N;a++){let rr=1,rc=1;for(let b=0;b<N;b++){if(M[a][b])dk++;
        if(b>0){if(M[a][b]===M[a][b-1]){rr++;if(rr===5)p+=3;else if(rr>5)p++}else rr=1;if(M[b][a]===M[b-1][a]){rc++;if(rc===5)p+=3;else if(rc>5)p++}else rc=1}
        if(a>0&&b>0&&M[a][b]===M[a-1][b]&&M[a][b]===M[a][b-1]&&M[a][b]===M[a-1][b-1])p+=3}}
      return p+Math.floor(Math.abs(dk*20-N*N*10)/(N*N))*10};
    let best=0,bp=1e9;for(const m of [0,1,4,5,6,7]){apply(m);fmt(m);const p=pen();if(p<bp){bp=p;best=m}apply(m)}
    apply(best);fmt(best);return M}
  function canvas(text,px=280){const M=encode(text),N=M.length,q=4,s=Math.max(2,Math.floor(px/(N+q*2))),c=document.createElement('canvas');c.width=c.height=(N+q*2)*s;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
    for(let y=0;y<N;y++)for(let i=0;i<N;i++)if(M[y][i])x.fillRect((i+q)*s,(y+q)*s,s,s);c.style.cssText='width:'+px+'px;height:'+px+'px;image-rendering:pixelated;border-radius:8px';return c}
  return {encode,canvas};
})();
/* ===================== DVIESE: RYŠYS PER INTERNETĄ (kambario kodas) =====================
   Žinutės keliauja per viešus MQTT serverius (per WebSocket). Jungiamės prie kelių iš karto –

async function sendUpdate(){mpCard(`<h2>📤 Siunčiamas atnaujinimas</h2><p>Draugo telefone senesnė versija (${MP.peerVer}). Siunčiu ${VERSION}…</p><div class="pbar"><i id="upb"></i></div>`);
  const h=await ownHtml();if(!h){mpCard('<h2>⚠️ Nepavyko</h2><p>Atnaujinkite abu telefonus per internetą.</p><button id="mpx">Gerai</button>');$('mpx').onclick=()=>$('overlay').classList.remove('show');return}
  const CH=30000,n=Math.ceil(h.length/CH);for(let i=0;i<n;i++){await new Promise(r=>setTimeout(r,150));mpSend({t:'up',i,n,ver:VERSION,d:h.slice(i*CH,(i+1)*CH)});const b=$('upb');if(b)b.style.width=((i+1)/n*100)+'%'}
  mpCard(`<h2>✅ Išsiųsta</h2><p>Draugo žaidimas persikrauna į ${VERSION}. Tada prisijunkite iš naujo per 👥.</p><button id="mpx">Gerai</button>`);$('mpx').onclick=()=>$('overlay').classList.remove('show')}
async function gotUpdate(m){if(!MP.up||MP.up.ver!==m.ver)MP.up={ver:m.ver,parts:[],got:0};const u=MP.up;if(u.parts[m.i]==null){u.parts[m.i]=m.d;u.got++}
  if(u.got===1)mpCard(`<h2>📥 Gaunamas atnaujinimas</h2><p>Versija ${m.ver} iš draugo telefono</p><div class="pbar"><i id="upb"></i></div>`);
  const b=$('upb');if(b)b.style.width=(u.got/m.n*100)+'%';
  if(u.got===m.n){const html=u.parts.join('');if(!html.includes('const VERSION=')){toast('⚠️ Atnaujinimas sugadintas','');return}
    try{const ks=await caches.keys();const names=ks.length?ks:['busjam-v2'];for(const k of names){const c=await caches.open(k);const res=()=>new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8'}});await c.put(new URL('./',location).href,res());await c.put(new URL('./index.html',location).href,res())}
      mpCard(`<h2>✅ Atnaujinta į ${m.ver}</h2><p>Žaidimas persikrauna…</p>`);setTimeout(()=>location.reload(),1200)}catch(e){mpCard('<h2>⚠️ Nepavyko įrašyti</h2><p>Atnaujink per internetą.</p>')}}}
/* --- žinutės --- */
function mpOnMsg(m){
  if(m.t==='bye'){MP.open=false;mpStatus();vsAbort('Draugas atsijungė');return}
  if(m.t==='away'){MP.away=true;renderOpp();toast('💤 Draugas išėjo iš žaidimo','Gal užgeso ekranas – palaukim');return}
  if(m.t==='back'){MP.away=false;renderOpp();toast('👋 Draugas grįžo','');return}
  if(m.t==='hb'){MP.away=false;if(VS.on&&MP.peerVer&&m.g!==VS.gid&&performance.now()-(VS.gt||0)>5000)vsAbort('Draugas nebežaidžia varžybų');return}
  if(m.t==='hi'){if(m.need)mpSend({t:'hi',ver:VERSION,role:MP.role,need:false});if(MP.peerVer){if(VS.on)vsAbort('Draugas prisijungė iš naujo');return}MP.peerVer=m.ver;const c=verCmp(VERSION,m.ver);
    if(c>0)return sendUpdate();
    if(c<0)return mpCard(`<h2>⏳ Laukiama atnaujinimo</h2><p>Tavo versija ${VERSION}, draugo ${m.ver}. Draugo telefonas tuoj atsiųs naujesnę.</p>`);
    sfx('star',2);toast('🔗 Sujungta!',MP.role==='host'?'Tu renkiesi nustatymus':'Draugas renkasi nustatymus');return openLobby()}
  if(m.t==='up')return gotUpdate(m);
  vsMsg(m)}
/* ===================== DVIESE: VERSUS ===================== */
var VS={want:{me:null,op:null},cfg:{mode:'vs',v:'race',bo3:false,atk:true,L:1},on:false,playing:false,lock:false,round:1,score:[0,0],me:null,opp:null,prev:null,combo:0,last:0};
const meName='🔵 Tu',opName='🟠 Draugas';
function lvName(L){const w=worldOf(L);return `${w.emoji} ${w.name} · ${lLoc(L)} lygis${KICON[kindOf(L)]||''}`}
function openLobby(){$('card').classList.add('wide');const c=VS.cfg,host=MP.role==='host';
  const opt=(k,v,t)=>`<button class="seg${c[k]===v?' on':''}" data-k="${k}" data-v="${v}"${host?'':' disabled'}>${t}</button>`;
  const tog=(k,t)=>`<button class="seg${c[k]?' on':''}" data-k="${k}" data-t="1"${host?'':' disabled'}>${c[k]?'✅':'⬜'} ${t}</button>`;
  showCard(`<div class="mpc"><h2>👥 Žaidžiam dviese</h2><p>${MP.open?'🟢 Draugas prisijungęs':'📴 Draugas atsijungęs'}${MP.room&&!MP.lan?' · kambarys '+MP.room:''}</p><p>${host?'Tu renkiesi nustatymus':'Nustatymus renkasi draugas'}</p>
    <div class="segs">${opt('mode','vs','⚔️ Versus')}${opt('mode','coop','🤝 Coop')}</div>
    ${c.mode==='vs'?`<div class="segs">${opt('v','race','🏁 Kas greičiau')}${opt('v','stars','⭐ Daugiau ★')}${opt('v','surv','🧱 Išgyvenimas')}</div>
    <div class="segs">${c.v==='surv'?'':tog('bo3','Partija iš 3')}${tog('atk','Atakos')}</div>
    <p class="mpd">${{race:'Laimi pirmas įveikęs lygį.',stars:'Laimi surinkęs daugiau ★ (laikas, ėjimai, užduotis). Lygiosios – greitesnis.',surv:'Lygiai eina vienas po kito be pertraukos – laimi tas, kuris ištveria ilgiau (daugiau išvežtų keleivių).'}[c.v]}${c.atk?' Už kombo (3 tos pačios spalvos iš eilės) draugui ant kelio numetamos kliūtys.':''}</p>`:
    `<p class="mpd">Viena aikštelė, dvi stotelės: kūrėjo 🔵 – viršuje, svečio 🟠 – apačioje. Kiekvienas turi savo keleivių spalvas – spausk tik savo spalvų autobusus, jie važiuos į tavo stotelę. Laimite arba pralaimite kartu.</p>`}
    ${`<div class="lvp"><button id="lm"${host?'':' disabled'}>−</button><div><b>${lvName(c.L)}</b><small>Lygis ${c.L}</small></div><button id="lp"${host?'':' disabled'}>+</button><button id="lr"${host?'':' disabled'}>🎲</button></div>`}
    ${host?`<button class="primary" id="go"${c.mode==='coop'&&!window.COOP?' disabled':''}>▶ Pradėti</button>`:'<p>⏳ Laukiama, kol draugas pradės</p>'}
    <button id="lx">Uždaryti</button><button id="ld" class="danger">Atsijungti</button></div>`);
  document.querySelectorAll('#card .seg').forEach(b=>b.onclick=()=>{const k=b.dataset.k;c[k]=b.dataset.t?!c[k]:b.dataset.v;vsCfg()});
  if(host&&$('lm')){$('lm').onclick=()=>{c.L=Math.max(1,c.L-1);vsCfg()};$('lp').onclick=()=>{c.L++;vsCfg()};$('lr').onclick=()=>{c.L=1+Math.floor(Math.random()*Math.max(30,unlocked+10));vsCfg()}}
  if(host&&$('go'))$('go').onclick=()=>{VS.round=1;VS.score=[0,0];vsStart(c.mode==='coop'?'coop':'go',c.L)};
  $('lx').onclick=()=>{$('card').classList.remove('wide');$('overlay').classList.remove('show')};$('ld').onclick=()=>{mpReset();mpStatus();vsAbort();$('overlay').classList.remove('show');toast('👋 Atsijungta','')}}
function vsCfg(){mpSend({t:'cfg',cfg:VS.cfg});openLobby()}
function vsStart(kind,L){const m={t:kind,L,cfg:VS.cfg,round:VS.round,score:VS.score,gid:Math.random().toString(36).slice(2,8),now:performance.now()};mpSend(m);vsMsg(m,true)}
function vsMsg(m,local){
  if(m.t==='cfg'){VS.cfg=m.cfg;if($('overlay').classList.contains('show')&&document.querySelector('#card .lvp,#card .segs'))openLobby();return}
  if(m.t==='go'){VS.gid=m.gid;VS.gt=performance.now();VS.cfg=m.cfg;VS.round=m.round;VS.score=local?m.score:[m.score[1],m.score[0]];return vsGo(m.L)}
  if(m.t==='coop'){VS.cfg=m.cfg;return coopGo(m.L,local,m)}
  if(m.t==='p'){if(VS.opp&&!VS.opp.end)Object.assign(VS.opp,m);return renderOpp()}
  if(m.t==='end'){if(!VS.opp)return;VS.opp.end=m;renderOpp();
    if(VS.playing){const raceLost=VS.cfg.v==='race'&&m.win,survWon=VS.cfg.v==='surv'&&!m.win;
      if(raceLost||survWon){vsEnd(survWon,true);return}
      toast(m.win?`🟠 Draugas baigė: ${'★'.repeat(m.st)}`:'🟠 Draugo stotelė užsikimšo','Tu dar žaidi');}
    return vsCheck()}
  if(m.t==='atk')return vsAttacked(m);
  if(m.t==='quit')return vsAbort('Draugas išėjo iš varžybų');
  if(m.t==='pick'){VS.cfg.L=m.L;VS.want={me:null,op:null};return renderResult()}
  if(m.t==='want'){VS.want.op=m.w;vsWantCheck();if(VS.coop&&VS.cres&&!VS.playing)renderCoopEnd();else if(VS.res!=null&&!VS.playing)renderResult();else if(m.w)toast('🟠 Draugas pasiruošęs',ACTN[m.w.act]);return}
  if(window.coopMsg)coopMsg(m)}
function vsGo(L){hideHome();VS.want={me:null,op:null};if(!VS.on)VS.prev=level;VS.on=true;VS.playing=true;VS.me=null;VS.opp={q:0,n:1,m:0,e:0,end:null};VS.combo=0;VS.lastL=L;VS.surv=VS.cfg.v==='surv';VS.survQ=0;VS.t0=0;
  $('card').classList.remove('wide');newGame(L,false,true);VS.lock=true;$('opp').classList.add('on');$('boost').style.visibility='hidden';layout();defaultView();renderOpp();
  let n=3;const tick=()=>{if(!VS.playing)return;if(n>0){showCard(`<div class="cd">${n}</div><p>${VS.cfg.bo3?`Raundas ${VS.round} · ${VS.score[0]}:${VS.score[1]}`:lvName(L)}</p>`);sfx('click');n--;setTimeout(tick,800)}
    else{$('overlay').classList.remove('show');VS.lock=false;startT=performance.now();VS.t0=startT;sfx('depart');toast('🚦 Važiuojam!','')}};tick()}
function vsElapsed(){const t0=VS.surv?VS.t0:startT;return t0?((endT||performance.now())-t0):0}
const vsQ=()=>(VS.surv?VS.survQ:0)+(game?game.qi:0);
// išgyvenime: įveikus lygį iš karto kraunamas kitas
function survNext(){VS.survQ+=game.qi;const L=level+1;newGame(L,false,true);startT=performance.now();toast('➡️ Kitas lygis','Iš viso '+VS.survQ+' keleivių');renderOpp()}
setInterval(()=>{if(VS.playing&&game&&startT)mpSend({t:'p',q:vsQ(),n:game.queue.length,m:game.moves,e:vsElapsed()})},600);
function vsEnd(win,forced){if(!VS.playing)return;if(VS.coop){mpSend({t:'cquit'});endT=performance.now();game.status='lose';coopEnd(false,COOP.host?0:1);return}VS.playing=false;if(game.status==='play'){game.status=win?'win':'lose';if(!win)game.reason='vs'}if(!endT)endT=performance.now();renderStats();
  const el=vsElapsed();VS.me={win,ms:el,m:game.moves,st:win&&!VS.surv?game.stars(el):0,q:vsQ(),forced:!!forced};
  mpSend({t:'end',...VS.me});
  if(!VS.opp.end)renderWait();
  vsCheck()}
function renderWait(){const a=VS.me;if(!a||VS.opp.end)return;const gone=!MP.open;
  showCard(`<h2>${a.win?'✅ Įveikta!':(VS.surv?'🧱 Stotelė užsikimšo':'😬 Nepavyko')}</h2><p>${fmt(a.ms)} · ${a.m} ėj.${VS.surv?' · '+a.q+' keleivių':''}</p><p>${gone?'📴 Draugas atsijungęs – laukiama, kol grįš':'⏳ Draugas dar žaidžia…'}</p><button id="wq">Baigti varžybas</button>`);
  $('wq').onclick=()=>{mpSend({t:'quit'});vsAbort()}}
function vsCheck(){if(!VS.me||!VS.opp||!VS.opp.end)return;const a=VS.me,b=VS.opp.end,v=VS.cfg.v;let r=0;
  if(v==='surv'){r=a.q===b.q?0:a.q>b.q?1:-1;if(a.win&&!b.win)r=1;if(b.win&&!a.win)r=-1}
  else if(v==='stars'){r=Math.sign(a.st-b.st);if(!r&&a.win&&b.win)r=Math.sign(b.ms-a.ms)}
  else{if(a.win&&b.win)r=Math.sign(b.ms-a.ms);else r=a.win?1:b.win?-1:0}
  VS.res=r;if(r>0)VS.score[0]++;else if(r<0)VS.score[1]++;VS.coin=addCoins(r>0?6:2);sfx(r>0?'win':r<0?'lose':'click');renderResult()}
function matchOver(){return !VS.cfg.bo3||VS.score[0]>=2||VS.score[1]>=2||VS.round>=3}
// kitas raundas / revanšas prasideda tik tada, kai abu patvirtina tą patį pasirinkimą
const ACTN={rematch:'↻ Revanšas',next:'Kitas lygis →',round:'▶ Kitas raundas'};
function vsWant(act){const L=act==='rematch'?VS.lastL:act==='next'?VS.lastL+1:VS.cfg.L;VS.want.me=act?{act,L}:null;mpSend({t:'want',w:VS.want.me});sfx('click');vsWantCheck();renderResult()}
function vsWantCheck(){const a=VS.want.me,b=VS.want.op;if(!a||!b||a.act!==b.act||a.L!==b.L||MP.role!=='host')return;
  if(VS.coop){VS.cfg.L=a.L;vsStart('coop',a.L);return}
  if(a.act==='round'){VS.round++;vsStart('go',a.L)}else{VS.round=1;if(VS.cfg.bo3)VS.score=[0,0];if(a.act==='next')VS.cfg.L=a.L;vsStart('go',a.L)}}
function renderResult(){if(VS.res==null||VS.playing)return;const a=VS.me,b=VS.opp.end,r=VS.res,over=matchOver(),fin=VS.cfg.bo3&&over,W=VS.want;
  const big=fin?(VS.score[0]>VS.score[1]?'🏆 Laimėjai partiją!':VS.score[0]<VS.score[1]?'🟠 Draugas laimėjo partiją':'🤝 Partija lygiosios'):(r>0?'🏆 Laimėjai!':r<0?'🟠 Draugas laimėjo':'🤝 Lygiosios');
  const row=(t,x,y)=>`<tr><td>${t}</td><td>${x}</td><td>${y}</td></tr>`,res=o=>o.win?'✅':(o.forced?'🏳️':'❌');
  const nextPicker=(VS.round+1)%2===1?'host':'guest',iPick=nextPicker===MP.role,bo=VS.cfg.bo3&&!over;
  const btn=(act,label,prim)=>{const mine=W.me&&W.me.act===act,his=W.op&&W.op.act===act&&(act!=='round'||W.op.L===VS.cfg.L);
    return `<button class="${prim||his?'primary':''}${mine?' wait':''}" data-a="${act}">${mine?'⏳ Laukiama draugo… (atšaukti)':label+(his?' · 🟠 draugas pasiruošęs':'')}</button>`};
  const status=W.me&&W.op&&W.me.act!==W.op.act?`<p class="wst">🟠 Draugas pasirinko: <b>${ACTN[W.op.act]}</b></p>`:W.me?'<p class="wst">⏳ Pradėsim, kai draugas patvirtins</p>':W.op?`<p class="wst">🟠 Draugas pasiruošęs: <b>${ACTN[W.op.act]}</b> – patvirtink</p>`:'<p class="wst">Pasirinkite, ką toliau – žaidimas prasidės, kai abu patvirtinsite</p>';
  showCard(`<div class="mpc"><h2>${big}</h2>${VS.cfg.bo3?`<div class="score">${VS.score[0]} : ${VS.score[1]}</div>`:''}
    <p class="coin">🪙 +${VS.coin||0}</p><table class="vst"><tr><th></th><th>${meName}</th><th>${opName}</th></tr>${row('Rezultatas',res(a),res(b))}${VS.surv?row('Keleivių',a.q,b.q):row('Laikas',fmt(a.ms),fmt(b.ms))+row('Ėjimai',a.m,b.m)+row('★',a.st,b.st)}</table>
    ${status}
    ${bo?(iPick?`<p>Tavo eilė rinktis ${VS.round+1} raundo lygį</p><div class="lvp"><button id="lm">−</button><div><b>${lvName(VS.cfg.L)}</b><small>Lygis ${VS.cfg.L}</small></div><button id="lp">+</button><button id="lr">🎲</button></div>`:`<p>${VS.round+1} raundo lygį renkasi draugas: <b>${lvName(VS.cfg.L)}</b></p>`)+btn('round',`✅ Pasiruošęs ${VS.round+1} raundui`,true)
    :btn('rematch','↻ Revanšas',true)+(VS.surv?'':btn('next','Kitas lygis →'))+'<button id="lb">⚙️ Keisti nustatymus</button>'}
    <button id="qt">Baigti varžybas</button></div>`);$('card').classList.add('wide');
  const pick=d=>{VS.cfg.L=Math.max(1,d);VS.want={me:null,op:null};mpSend({t:'pick',L:VS.cfg.L});renderResult()};
  if($('lm')){$('lm').onclick=()=>pick(VS.cfg.L-1);$('lp').onclick=()=>pick(VS.cfg.L+1);$('lr').onclick=()=>pick(1+Math.floor(Math.random()*Math.max(30,unlocked+10)))}
  document.querySelectorAll('#card [data-a]').forEach(bt=>bt.onclick=()=>{const act=bt.dataset.a;vsWant(W.me&&W.me.act===act?null:act)});
  if($('lb'))$('lb').onclick=()=>{mpSend({t:'want',w:null});VS.want.me=null;openLobby()};
  $('qt').onclick=()=>{mpSend({t:'quit'});vsAbort()}}
function vsAbort(msg){if(!VS.on)return;coopOff();VS.cres=null;VS.on=false;VS.playing=false;VS.lock=false;VS.res=null;$('opp').classList.remove('on');$('boost').style.visibility='';$('card').classList.remove('wide');
  if(msg)toast('👥 '+msg,'');const p=VS.prev||level;newGame(p)}
function renderOpp(){const o=VS.opp;if(!o)return;
  if(VS.coop&&game&&game.S){const q=performance.now()-MP.last,st=MP.away?'<b class="ost warn">💤</b>':!MP.open?'<b class="ost bad">📴</b>':q>6000?'<b class="ost warn">⚠️</b>':'',a=game.qOf(0),A=game.S[0].queue.length,b=game.qOf(1),B=game.S[1].queue.length,me=COOP.host?0:1;
    $('opp').innerHTML=`<span class="on">🤝 Coop</span>${st}<div class="obar"><i style="width:${Math.round((a+b)/Math.max(1,A+B)*100)}%"></i></div><span class="ot">🔵 ${a}/${A}${me===0?' (tu)':''} · 🟠 ${b}/${B}${me===1?' (tu)':''}</span>`;return}const pct=o.end?(o.end.win?100:Math.round((o.end.q||o.q)/Math.max(1,o.n)*100)):Math.round(o.q/Math.max(1,o.n)*100);
  const q=performance.now()-MP.last,st=MP.away?'<b class="ost warn">💤 išėjo iš programos</b>':!MP.open?'<b class="ost bad">📴 atsijungęs</b>':q>6000?'<b class="ost warn">⚠️ neatsiliepia</b>':'';
  $('opp').innerHTML=`<span class="on">${opName}</span>${st}<div class="obar"><i style="width:${VS.surv?Math.min(100,o.q/3):pct}%"></i></div><span class="ot">${o.end?(o.end.win?'✅ '+fmt(o.end.ms):(VS.surv?'🧱 '+o.end.q:'❌')):(VS.surv?o.q+' 👥':pct+'%')+' · '+o.m+' ėj.'}</span>${VS.cfg.bo3?`<b class="osc">${VS.score[0]}:${VS.score[1]}</b>`:''}`}
/* --- atakos: kombo → kliūtis draugui ant kelio --- */
function vsAfterTap(){if(!VS.playing||!VS.cfg.atk)return;const e=game.exitCols;if(e.length<3||e.length-VS.combo<3)return;const k=e.length;
  if(e[k-1]===e[k-2]&&e[k-2]===e[k-3]){VS.combo=k;mpSend({t:'atk'});sfx('star',3);toast('⚔️ Kombo! Draugui užtvertas kelias','')}}
function vsAttacked(){if(!VS.playing||!game||game.status!=='play')return;const busy=new Set(game.robs.filter(o=>o.on).map(o=>o.cells[0].join()));
  const cand=(game.segList||[]).filter(sg=>!busy.has(sg.cells[0].join()));if(!cand.length)return;const sg=cand[Math.floor(Math.random()*cand.length)];
  game.robs.push({kind:'atk',cells:sg.cells,vert:sg.vert,t:game.qi+4,dl:performance.now()+20000,on:true});addObsEl(game.robs.length-1);sfx('storm');toast('⚔️ Draugas atakavo!','Kelias užtvertas 4 keleiviams ar 20 s')}

</script>
